workflows:
  speed-rovers-ios:
    name: Speed Rovers 2 - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: false
    when:
      changeset:
        includes:
          - 'CI/**'
          - 'Assets/**'
          - 'Packages/**'
          - 'ProjectSettings/**'
          - codemagic.yaml
    integrations:
      app_store_connect: app-store-connect
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - toatre-ios-distribution
        provisioning_profiles:
          - speed-rovers-appstore
      vars:
        BUNDLE_ID: com.philino.speedrovers.reborn
        APP_STORE_APP_ID: '6822590400'
    scripts:
      - name: Restore verified current Unity iOS export
        script: |
          set -euo pipefail
          python3 CI/verify_source.py
          git lfs install --skip-smudge
          git lfs pull --include="CI/ios-export.tar.gz"
          shasum -a 256 -c CI/ios-export.sha256
          mkdir -p build/ios
          tar -xzf CI/ios-export.tar.gz -C build/ios
          python3 CI/prepare_ios.py
      - name: Apply Speed Rovers 2 App Store signing profile
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          python3 CI/ensure_profile.py
          xcode-project use-profiles --project build/ios/Unity-iPhone.xcodeproj
      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project build/ios/Unity-iPhone.xcodeproj --scheme Unity-iPhone
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Internal groups automatically receive uploaded builds. Validate
        # device installation before submitting this new app for external review.
        submit_to_testflight: false
        submit_to_app_store: false
