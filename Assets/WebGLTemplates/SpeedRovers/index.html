<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" type="image/png" href="AppIcon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #061423; color: #edf7fc; }
    body { display: grid; place-items: center; overflow: hidden; font-family: system-ui, sans-serif; }
    #game { position: relative; width: min(100vw, 56.25dvh); height: min(100dvh, 177.78vw); }
    canvas { display: block; width: 100%; height: 100%; background: #061423; outline: 0; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; padding: 32px; text-align: center; background: #061423; }
    #loading[hidden] { display: none; }
    progress { width: min(240px, 70vw); height: 8px; accent-color: #fda51b; }
    #status { max-width: 28ch; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="Speed Rovers game"></canvas>
    <div id="loading" role="status"><strong>Speed Rovers</strong><progress max="1" value="0"></progress><span id="status">Loading your ride…</span></div>
  </main>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    createUnityInstance(canvas, {
      arguments: [],
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
#endif
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, value => loading.querySelector('progress').value = value).then(() => {
      loading.hidden = true;
      canvas.focus();
    }).catch(error => {
      loading.querySelector('progress').hidden = true;
      document.getElementById('status').textContent = 'The game could not start. Reload this page to try again.';
      console.error(error);
    });
  </script>
</body>
</html>
